  </g>

  <text x="512" y="690" text-anchor="middle" font-family="Montserrat, Avenir Next, Arial Black, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="10" fill="#1C1C1C">KISHUKA</text>
  <text x="512" y="748" text-anchor="middle" font-family="Montserrat, Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="8" fill="#E8B84A">STEAM &amp; CLEAN</text>
  <text x="512" y="792" text-anchor="middle" font-family="Montserrat, Avenir Next, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="6" fill="#0F5C5B">DARWIN NT</text>
</svg>
